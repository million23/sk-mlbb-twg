<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>{{block "title" .}}{{.siteTitle}}{{end}}</title>
  </head>
  <body
    style="margin:0;padding:0;background:#f4f1ec;font-family:Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased;"
  >
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f4f1ec;padding:32px 16px;">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="max-width:560px;background:#fffdf9;border:1px solid #e7e0d6;border-radius:24px;overflow:hidden;"
          >
            <tr>
              <td style="padding:28px 28px 12px;background:linear-gradient(135deg,#1a1512 0%,#2c221c 100%);">
                <p
                  style="margin:0 0 6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#e08a5d;"
                >
                  {{.siteTitle}}
                </p>
                <h1
                  style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:26px;line-height:1.2;font-weight:400;color:#fffaf4;"
                >
                  {{block "heading" .}}Notice{{end}}
                </h1>
              </td>
            </tr>
            <tr>
              <td
                style="padding:28px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.55;color:#2a241f;"
              >
                {{block "body" .}}{{end}}
              </td>
            </tr>
            <tr>
              <td
                style="padding:0 28px 28px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px;line-height:1.5;color:#7a6f65;"
              >
                <p style="margin:0 0 8px;">
                  SK Barangay 176-E · Mobile Legends tournament desk
                </p>
                <p style="margin:0;">
                  © {{.year}} {{.siteTitle}}. This message was sent by the tournament
                  server mailer.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
